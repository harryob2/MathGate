name: MathGate
options:
  bundleIdPrefix: com.harryobrien
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set DEVELOPMENT_TEAM in a local xcconfig or in Xcode's Signing pane; a fork needs its own.
    CODE_SIGN_STYLE: Automatic
packages:
  MathGateKit:
    path: MathGateKit
schemes:
  MathGate:
    build:
      targets:
        MathGate: all
        MathGateMonitor: all
        MathGateShield: all
        MathGateShieldAction: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MathGateTests
targets:
  MathGate:
    type: application
    platform: iOS
    info:
      path: Generated/MathGate-Info.plist
      properties:
        CFBundleDisplayName: MathGate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Opportunistic unlock without opening the app. Never the guarantee: the shield's own
        # button and the daily-reset monitor are what the gate actually relies on.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.harryobrien.mathgate.refresh
    sources:
      - path: App
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - package: MathGateKit
      - target: MathGateMonitor
      - target: MathGateShield
      - target: MathGateShieldAction
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harryobrien.mathgate
        CODE_SIGN_ENTITLEMENTS: MathGate.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MathGateMonitor:
    type: app-extension
    platform: iOS
    info:
      path: Generated/MathGateMonitor-Info.plist
      properties:
        CFBundleDisplayName: MathGate Daily Reset
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MathGateDeviceActivityMonitor
    sources:
      - path: Monitor
      - path: Shared
    dependencies:
      - package: MathGateKit
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harryobrien.mathgate.monitor
        CODE_SIGN_ENTITLEMENTS: MathGateMonitor.entitlements

  MathGateShield:
    type: app-extension
    platform: iOS
    info:
      path: Generated/MathGateShield-Info.plist
      properties:
        CFBundleDisplayName: MathGate Block Screen
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MathGateShieldConfigurationExtension
    sources:
      - path: Shield
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - package: MathGateKit
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harryobrien.mathgate.shield
        CODE_SIGN_ENTITLEMENTS: MathGateShield.entitlements

  MathGateShieldAction:
    type: app-extension
    platform: iOS
    info:
      path: Generated/MathGateShieldAction-Info.plist
      properties:
        CFBundleDisplayName: MathGate Shield Actions
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MathGateShieldActionExtension
    sources:
      - path: ShieldAction
      - path: Shared
    dependencies:
      - package: MathGateKit
      - sdk: DeviceActivity.framework
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harryobrien.mathgate.shieldaction
        CODE_SIGN_ENTITLEMENTS: MathGateShieldAction.entitlements

  MathGateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MathGate
      - package: MathGateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harryobrien.mathgate.tests
        GENERATE_INFOPLIST_FILE: YES
